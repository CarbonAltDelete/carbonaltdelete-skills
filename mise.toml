[tools]
lefthook = "2.2.2"
taplo = "0.10.0"
"npm:@biomejs/biome" = "2.3.11"
"npm:markdownlint-cli2" = "0.23.3"

[tasks.lint]
description = "Run all repository linters"
depends = ["lint:markdown", "lint:json", "lint:toml"]

[tasks."lint:markdown"]
description = "Lint Markdown files"
run = 'markdownlint-cli2 "**/*.md"'

[tasks."lint:json"]
description = "Lint and format-check JSON files"
run = "biome check --no-errors-on-unmatched ."

[tasks."lint:toml"]
description = "Validate and format-check TOML files"
run = ["taplo check", "taplo fmt --check"]
