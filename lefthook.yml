min_version: "2.2.2"

pre-commit:
  parallel: true
  commands:
    markdown:
      glob:
        - "*.md"
        - "**/*.md"
      run: mise exec -- markdownlint-cli2 {staged_files}
    json:
      glob:
        - "*.json"
        - "**/*.json"
      run: mise exec -- biome check {staged_files}
    toml:
      glob:
        - "*.toml"
        - "**/*.toml"
      run: mise exec -- taplo check {staged_files} && mise exec -- taplo fmt --check {staged_files}
